<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة التداول الاحترافية</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { 
            background: #0a0a0a; 
            color: #fff; 
            font-family: 'Tajawal', sans-serif; 
            margin: 0; 
            padding: 20px; 
        }
        .header { 
            text-align: center; 
            padding: 30px; 
            background: linear-gradient(90deg, #00f260, #0575e6); 
            border-radius: 15px; 
            margin-bottom: 20px;
        }
        .header h1 { margin: 0; font-size: 28px; }
        .card { 
            background: #1a1a1a; 
            padding: 20px; 
            border-radius: 15px; 
            margin-top: 20px; 
            border: 1px solid #333; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        table { 
            width: 100%; 
            border-collapse: collapse; 
        }
        th, td { 
            padding: 12px; 
            text-align: center; 
            border-bottom: 1px solid #333; 
        }
        th { color: #00f260; }
        .up { color: #00f260; font-weight: bold; } 
        .down { color: #ff4d4d; font-weight: bold; }
        canvas { max-height: 300px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>TRADING SIM PRO</h1>
        <p>منصة التداول الاحترافية - بيانات لحظية</p>
    </div>

    <div class="card">
        <h2>📊 الأسعار اللحظية</h2>
        <table>
            <tr><th>الأصل</th><th>السعر</th><th>التغير 24س</th></tr>
            <tr><td>BTC/USD</td><td>68,420 $</td><td class="up">+2.3%</td></tr>
            <tr><td>ETH/USD</td><td>3,510 $</td><td class="down">-1.1%</td></tr>
            <tr><td>EUR/USD</td><td>1.0845 $</td><td class="up">+0.4%</td></tr>
        </table>
    </div>

    <div class="card">
        <h2>📈 شارت BTC/USD</h2>
        <canvas id="myChart"></canvas>
    </div>

    <script>
        const ctx = document.getElementById('myChart');
        new Chart(ctx, { 
            type: 'line', 
            data: { 
                labels: ['9ص','10ص','11ص','12ظ','1ظ','2ظ'], 
                datasets: [{ 
                    label: 'BTC USD', 
                    data: [67400, 67600, 68200, 67900, 68420, 68600], 
                    borderColor: '#00f260', 
                    backgroundColor: 'rgba(0, 242, 96, 0.1)',
                    tension: 0.4,
                    fill: true
                }] 
            },
            options: {
                responsive: true,
                plugins: { legend: { labels: { color: '#fff' } } },
                scales: {
                    x: { ticks: { color: '#aaa' } },
                    y: { ticks: { color: '#aaa' } }
                }
            }
        });
    </script>
</body>
</html>
